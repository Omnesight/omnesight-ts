name: 🐛 Bug Report
description: Report an issue or unexpected behavior in the Omnesight TypeScript SDK
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! Please fill out the form below to help us diagnose and resolve the bug as quickly as possible.
  - type: dropdown
    id: component
    attributes:
      label: SDK Component
      description: Which part of the SDK is affected?
      options:
        - "Omnesight Client / API Connection"
        - "Scientific Engines (Hackmalim / Sandalfon)"
        - "Telemetry Ingestion (SCADA, IoT, TelemetryClient)"
        - "ERP & Financial Reconciliation (SAP, Dynamics, T24)"
        - "Supervised Action Protocol (SAP) / Firewall"
        - "Sandbox Mode"
        - "Other / Installation"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK Version
      description: "Check your package.json or run: npm ls @omnesight/sdk"
      placeholder: "e.g. 1.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Node.js version, and runtime (Node / Deno / Bun)
      placeholder: "e.g. macOS Sonoma 14.5 / Node.js 22.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: "When calling client.telemetry.ingestStream(), the event buffer..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Steps
      description: Provide a minimal, reproducible code snippet.
      placeholder: |
        ```typescript
        import { Omnesight } from '@omnesight/sdk';

        const client = new Omnesight({ apiKey: 'test' });
        // Trigger bug here
        ```
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Output & Stack Trace
      description: Paste the full error output or relevant logs.
      render: shell
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "Low: Minor cosmetic or non-blocking inconvenience"
        - "Medium: Feature impaired but workaround available"
        - "High: Critical workflow broken, blocking execution"
        - "Blocker: Data integrity risk or system crash"
    validations:
      required: true
